database:
  host: localhost
  database: rmt
  username: rmt
  password:
  adapter: mysql2
  encoding: utf8
  timeout: 5000
  pool: 5

scc:
  username:
  password:
  sync_systems: true
  metrics:
    enabled: false
    job_name: rmt

mirroring:
  mirror_drpm: true
  mirror_src: false
  revalidate_repodata: true
  # Set to false to skip re-parsing unchanged metadata.
  # Recommended for environments with many large repositories.
  dedup_method: hardlink
  # Performance tuning (defaults shown, uncomment to change):
  # download_concurrency: 4
  # head_concurrency: 4
  # retry_count: 4
  # retry_delay: 2
  # exponential_backoff: false
  # full_revalidation_day: saturday

http_client:
  verbose: false
  proxy:
  proxy_auth:
  proxy_user:
  proxy_password:
  low_speed_limit: 512
  low_speed_time: 120

log_level:
  rails: info
  cli: info

web_server:
  min_threads: 5
  max_threads: 5
  workers: 2
